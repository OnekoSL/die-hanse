[project]
name = "die-hanse-backend"
version = "0.1.0a2"
description = "Hanse Handelssimulation Backend"
requires-python = ">=3.11,<3.12"
dependencies = [
  "fastapi==0.141.1",
  "uvicorn[standard]==0.52.4",
  "sqlalchemy==2.0.52",
  "pydantic==2.13.5"
]

[project.optional-dependencies]
dev = [
  "pytest==9.1.1",
  "httpx==0.28.1",
  "ruff==0.16.7"
]

[tool.pytest.ini_options]
pythonpath = ["."]
addopts = "-q"

[tool.ruff]
line-length = 100

[tool.ruff.lint]
# Keep CI stable across Ruff releases by selecting the classic correctness rules explicitly.
select = ["E4", "E7", "E9", "F"]
